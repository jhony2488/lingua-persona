name: Build, PWA Package & Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*" # Dispara quando tags no formato v1.0.0, v2.1.0 forem enviadas

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão necessária para criar a Release no GitHub

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      # .npmrc desabilita lifecycle scripts (ignore-scripts=true) por segurança.
      # Os engines do Prisma são baixados via postinstall, então reconstruímos
      # apenas os pacotes que realmente precisam de binários nativos.
      - name: Restaurar engines do Prisma
        run: npm rebuild @prisma/engines esbuild

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build da Aplicação PWA
        run: npm run build

      # --- ETAPA DE EMPACOTAMENTO DA APLICAÇÃO ---
      - name: Gerar Pacotes .pk e .rxe
        run: |
          echo "Empacotando build do PWA em formatos .pk e .rxe..."

          # Pacote .pk: assets estáticos do PWA
          tar -czf app-release.pk -C .next/static .

          # Pacote .rxe: build completo da aplicação
          zip -r app-release.rxe .next/

          # Checksum SHA256 para verificação de integridade
          sha256sum app-release.pk app-release.rxe > SHA256SUMS.txt

      # --- ETAPA DE CRIAÇÃO DO RELEASE NO GITHUB ---
      - name: Criar Release e Anexar Binários
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.pk
            app-release.rxe
            SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
