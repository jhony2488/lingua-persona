name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # .npmrc disables lifecycle scripts (ignore-scripts=true) for security.
      # Prisma's query engines are downloaded via postinstall, so we rebuild
      # only the packages that strictly need native binaries.
      - name: Restore Prisma engines
        run: npm rebuild @prisma/engines esbuild

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Restore Prisma engines
        run: npm rebuild @prisma/engines esbuild

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # webServer starts `next dev` and waits for /api/health; the schema is
      # bootstrapped by instrumentation.ts on first request.
      - name: E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: file:./dev.db

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
